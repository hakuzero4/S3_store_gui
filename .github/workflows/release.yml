name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0). Leave empty to use latest tag tip sha."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          # strip leading v for display extras if needed
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Sync embed assets
        run: |
          rm -rf internal/static/dist
          cp -a web/dist internal/static/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build multi-platform binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "==> ${out}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "${LDFLAGS}" \
              -o "release/${out}" ./cmd/s3store
          }

          build windows amd64 "s3store_${VERSION}_windows_amd64.exe"
          build windows arm64 "s3store_${VERSION}_windows_arm64.exe"
          build linux   amd64 "s3store_${VERSION}_linux_amd64"
          build linux   arm64 "s3store_${VERSION}_linux_arm64"
          build darwin  amd64 "s3store_${VERSION}_darwin_amd64"
          build darwin  arm64 "s3store_${VERSION}_darwin_arm64"

          # convenient short names
          cp "release/s3store_${VERSION}_windows_amd64.exe" "release/s3store-windows-amd64.exe"
          cp "release/s3store_${VERSION}_linux_amd64" "release/s3store-linux-amd64"
          cp "release/s3store_${VERSION}_darwin_arm64" "release/s3store-darwin-arm64"

          cd release
          sha256sum * > checksums.txt
          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: S3 Store ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
